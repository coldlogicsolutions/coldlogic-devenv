# Copied into each project as .github/workflows/update-coldlogic-devenv.yaml.
#
# Moves the project's coldlogic-devenv pin forward and proposes it as a PR,
# opened as the coldlogic-ai App like every other automated PR. The project's
# own CI on that PR is the test (an App token, unlike GITHUB_TOKEN, triggers
# it). Runs weekly, by hand, and when coldlogic-devenv's main moves: its
# dispatch-updates workflow sends every repository the
# `coldlogic-devenv-updated` event.
#
# Needs the COLDLOGIC_AI_CLIENT_ID and COLDLOGIC_AI_PRIVATE_KEY secrets, which
# the infrastructure stack puts in a `coldlogic-ai` environment, deployable
# only from main, in every registered repository. Only the second job sees
# them: the first runs Nix and devenv, and hands over nothing but devenv.lock.
name: Update coldlogic-devenv

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [coldlogic-devenv-updated]

permissions:
  contents: read

concurrency:
  group: update-coldlogic-devenv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Update the pin
        run: devenv update coldlogic-devenv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devenv-lock
          path: devenv.lock
          retention-days: 1

  pull-request:
    needs: update
    # Only main's copy of this workflow may use the App key: the environment
    # enforces that, and this skips the job instead of failing it.
    if: github.ref == 'refs/heads/main'
    environment: coldlogic-ai
    runs-on: ubuntu-latest
    # The App token does the writing; GITHUB_TOKEN only checks out.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devenv-lock
          path: updated

      # The first job ran third-party code, so its lock is only a source of
      # three values, each checked: the revision must be on the module's main
      # as GitHub reports it (main itself, or behind it if main moved since
      # the first job), and the new lock is the repository's own with just
      # those values replaced. Nix verifies narHash when it fetches the
      # revision. Fails closed.
      - name: Take the new revision from the updated lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node='.nodes."coldlogic-devenv".locked'
          rev=$(jq -er "$node.rev" updated/devenv.lock)
          nar_hash=$(jq -er "$node.narHash" updated/devenv.lock)
          last_modified=$(jq -er "$node.lastModified" updated/devenv.lock)
          [[ $rev =~ ^[0-9a-f]{40}$ ]] || { echo "bad revision" >&2; exit 1; }
          # main compared with the revision: "identical", or "ahead" when main
          # has moved on from it. Anything else is a revision off main.
          status=$(gh api "repos/coldlogicsolutions/coldlogic-devenv/compare/$rev...main" --jq .status)
          [[ $status == identical || $status == ahead ]] ||
            { echo "revision $rev is not on coldlogic-devenv's main ($status)" >&2; exit 1; }
          # Nor behind the project's current pin: an update never rolls back.
          current=$(jq -er "$node.rev" devenv.lock)
          [[ $current =~ ^[0-9a-f]{40}$ ]] || { echo "bad current revision" >&2; exit 1; }
          status=$(gh api "repos/coldlogicsolutions/coldlogic-devenv/compare/$current...$rev" --jq .status)
          [[ $status == identical || $status == ahead ]] ||
            { echo "revision $rev is behind the current pin $current ($status)" >&2; exit 1; }
          [[ $nar_hash =~ ^sha256-[A-Za-z0-9+/]+=*$ ]] || { echo "bad narHash" >&2; exit 1; }
          [[ $last_modified =~ ^[0-9]{1,12}$ ]] || { echo "bad lastModified" >&2; exit 1; }
          # devenv writes the lock without a trailing newline; so does this.
          new_lock=$(jq --arg rev "$rev" --arg hash "$nar_hash" --argjson modified "$last_modified" \
            "$node |= (.rev = \$rev | .narHash = \$hash | .lastModified = \$modified)" devenv.lock)
          printf '%s' "$new_lock" > devenv.lock.new
          mv devenv.lock.new devenv.lock
          rm updated/devenv.lock
          rmdir updated

      # Moves the inputs the module asks projects to declare, and devenv, to
      # the revisions the module itself locks, read from GitHub at the revision checked
      # above. The module's cache job (dispatch-updates.yaml) builds and
      # pushes the shells with exactly these, so the project's shells
      # download rather than build. An input the project declares differently
      # (another branch, say) is left alone.
      - name: Align nixpkgs, rust-overlay, git-hooks and devenv with the module's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rev=$(jq -er '.nodes."coldlogic-devenv".locked.rev' devenv.lock)
          module=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/coldlogicsolutions/coldlogic-devenv/contents/devenv.lock?ref=$rev")
          for input in nixpkgs rust-overlay git-hooks devenv; do
            # The node each lock names for the input; a `follows` is a list.
            ours=$(jq -r --arg i "$input" '.nodes.root.inputs[$i] | strings' devenv.lock)
            theirs=$(jq -r --arg i "$input" '.nodes.root.inputs[$i] | strings' <<<"$module")
            if [[ -z $ours || -z $theirs ]]; then
              echo "$input: not a direct input of both locks, left alone"
              continue
            fi
            # Declared the same way: the same source, and the same `follows`
            # (rust-overlay's nixpkgs), with any input of its own as its own.
            if ! jq -e --arg o "$ours" --arg t "$theirs" --argjson m "$module" '
              def shape: (.inputs // {}) | map_values(if type == "array" then . else "own" end);
              .nodes[$o].original == $m.nodes[$t].original
                and (.nodes[$o] | shape) == ($m.nodes[$t] | shape)' devenv.lock >/dev/null; then
              echo "$input: declared differently from the module's, left alone"
              continue
            fi
            new_lock=$(jq --arg o "$ours" --arg t "$theirs" --argjson m "$module" \
              '.nodes[$o].locked = $m.nodes[$t].locked' devenv.lock)
            printf '%s' "$new_lock" > devenv.lock.new
            mv devenv.lock.new devenv.lock
            echo "$input: $(jq -r --arg o "$ours" '.nodes[$o].locked.rev // "?"' devenv.lock)"
          done

      # Limited to this repository and to what opening a PR needs.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.COLDLOGIC_AI_CLIENT_ID }}
          private-key: ${{ secrets.COLDLOGIC_AI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Opens the PR, or refreshes the open one, only when devenv.lock moved.
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-coldlogic-devenv
          add-paths: devenv.lock
          commit-message: "chore(devenv): update coldlogic-devenv"
          # The App's bot user, not whoever triggered the run.
          author: coldlogic-ai[bot] <319737866+coldlogic-ai[bot]@users.noreply.github.com>
          committer: coldlogic-ai[bot] <319737866+coldlogic-ai[bot]@users.noreply.github.com>
          title: Update coldlogic-devenv
          body: |
            ## Summary
            - Moves `coldlogic-devenv` in `devenv.lock` to the module's latest revision.
            - Moves `nixpkgs`, `rust-overlay`, `git-hooks` and `devenv` to the revisions the module locks, where the project declares them the same way, so its shells come from the `coldlogic` cache.

            ## Test plan
            - CI tests this PR. Auto-merge is on: it merges once approved and green.
          reviewers: derekjw
          draft: false

      # Approval is still required (the ruleset): this only saves merging by
      # hand once it's given and CI passes. Squash is the merge method every
      # repository allows.
      - name: Turn on auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
