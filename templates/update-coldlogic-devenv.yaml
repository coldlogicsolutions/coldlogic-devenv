# Copied into each project as .github/workflows/update-coldlogic-devenv.yaml.
#
# Moves the project's coldlogic-devenv pin forward and proposes it as a PR,
# opened as the coldlogic-ai App like every other automated PR. The project's
# own CI on that PR is the test (an App token, unlike GITHUB_TOKEN, triggers
# it).
#
# Needs the COLDLOGIC_AI_APP_ID and COLDLOGIC_AI_PRIVATE_KEY secrets, which
# the infrastructure stack shares with every registered repository. Only the
# second job sees them: the first runs Nix and devenv, and hands over nothing
# but devenv.lock.
name: Update coldlogic-devenv

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-coldlogic-devenv
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Update the pin
        run: devenv update coldlogic-devenv

      - uses: actions/upload-artifact@v4
        with:
          name: devenv-lock
          path: devenv.lock
          retention-days: 1

  pull-request:
    needs: update
    # Only main's copy of this workflow may use the App key.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: devenv-lock

      # Limited to this repository and to what opening a PR needs.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.COLDLOGIC_AI_APP_ID }}
          private-key: ${{ secrets.COLDLOGIC_AI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Opens the PR, or refreshes the open one, only when devenv.lock moved.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-coldlogic-devenv
          add-paths: devenv.lock
          commit-message: "chore(devenv): update coldlogic-devenv"
          title: Update coldlogic-devenv
          body: |
            ## Summary
            - Moves `coldlogic-devenv` in `devenv.lock` to the module's latest revision.

            ## Test plan
            - This project's CI runs on this PR in the updated shell.
          reviewers: derekjw
          draft: false
